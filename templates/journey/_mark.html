{% load i18n %}<form method="post" action="{% url 'journey:mark' flag %}" style="margin-top:12px">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.path }}">
  {% if done %}<input type="hidden" name="value" value="0"><button class="btn block ghost"><span class="tag ok">{% translate "DONE" %}</span> {% translate done_label %} · {% translate "undo" %}</button>
  {% else %}<input type="hidden" name="value" value="1"><button class="btn go block">✓ {% translate todo_label %}</button>{% endif %}
</form>
