{% extends "base.html" %}
{% block title %}Enter code{% endblock %}
{% block content %}
<h1>Enter the code</h1>
<p class="mute">We sent a 6-digit code to your phone. It expires in 5 minutes.</p>
<form method="post" class="card stack">{% csrf_token %}
  <div class="field"><label for="code">Code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>
  <button class="btn primary block">Verify</button>
</form>
{% endblock %}
