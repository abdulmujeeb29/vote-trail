[project]
name = "votetrail"
version = "0.1.0"
description = "Voice-first voter companion: alerts, results check and rumour check for Nigerian elections."
requires-python = ">=3.12,<3.13"
dependencies = [
  "django>=5.2,<6",
  "django-environ>=0.12",
  "whitenoise>=6.9",
  "gunicorn>=23",
  "cryptography>=44",
  "pillow>=11",
  "imagehash>=4.3",
  "httpx>=0.28",
  "openai>=1.80",
  "psycopg[binary]>=3.2",
  "websockets>=14",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.10",
  "pytest-cov>=6",
  "hypothesis>=6.130",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "votetrail.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = ["live: calls real external services (run on demand)", "pg: requires Postgres"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ", "S", "RUF"]
ignore = ["S101", "RUF012", "S311", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"scripts/**" = ["S603", "S607", "E402", "BLE001"]

[tool.coverage.run]
branch = true
source = ["apps"]
omit = ["*/migrations/*"]
